collection:
  - url: "{{ _.BASE_URL.base_url }}/posts/1"
    name: Posts/1
    meta:
      id: req_e55060e1ae384a6c9b89b5ebfa4f9d19
      created: 1790092145376
      modified: 1790093416021
      isPrivate: false
      description: ""
      sortKey: -1790092740889
    method: GET
    body:
      mimeType: application/json
      text: |-
        const response = await insomnia.send();
        expect(response.status).to.equal(200);

        const body = JSON.parse(response.data);
        expect(body).to.have.property('id');
        expect(body).to.have.property('title');
        expect(body).to.have.property('body');
        expect(body).to.have.property('userId');
    headers:
      - name: Content-Type
        value: application/json
    scripts:
      afterResponse: |-
        insomnia.test("Status code is 200", function () {
            insomnia.response.to.have.status(200);
        });

        insomnia.test("Response time is less than 1000ms", function () {
            insomnia.expect(insomnia.response.responseTime).to.be.below(1000);
        });

        insomnia.test("Tiene las propiedades requeridas", function () {
            var jsonData = insomnia.response.json();
            insomnia.expect(jsonData).to.have.property('id');
            insomnia.expect(jsonData).to.have.property('title');
            insomnia.expect(jsonData).to.have.property('body');
            insomnia.expect(jsonData).to.have.property('userId');
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
